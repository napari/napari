[build-system]
requires = [
  "setuptools >= 77.0.1",
  "setuptools_scm[toml]>=8"
]
build-backend = "setuptools.build_meta"

[project]
name = "napari"
description = "n-dimensional array viewer in Python"
authors = [
    { name = "napari team", email = "napari-steering-council@googlegroups.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Framework :: napari",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: C",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Utilities",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = [
    "LICENSE",
]
dependencies = [
    "app-model>=0.5.0,<0.6.0",
    "cachey>=0.2.1",
    "certifi>=2018.1.18",
    "dask[array]>=2022.1.1",
    "imageio>=2.20,!=2.22.1",
    "jsonschema>=3.2.0",
    "lazy_loader>=0.3",
    "magicgui>=0.7.0",
    "napari-console>=0.1.4",
    "napari-plugin-engine>=0.2.1",
    "napari-svg>=0.1.8",
    "npe2>=0.9.0",
    "numpy>=1.25",
    "pandas>=1.5.0",
    "Pillow>=10.0",
    "pint>=0.17",
    "platformdirs>=4.3.0",
    "psutil>=5.9.4",
    "psygnal>=0.14.2",
    "pydantic>=2.8.0",
    "pygments>=2.13.0",
    "pydantic-extra-types",
    "pydantic-settings",
    "PyOpenGL>=3.1.10",
    "pywin32 ; platform_system == 'Windows'",
    "PyYAML>=6.0",
    "qtpy>=2.4.0",
    "scikit-image[data]>=0.20.0",
    "scipy>=1.14.0",
    "superqt>=0.7.8",
    "tifffile>=2022.7.28",
    "toolz>=0.12.1",
    "tqdm>=4.56.0",
    "typing_extensions>=4.12",
    "vispy>=0.16.2,<0.17",
    "wrapt>=1.14.1",
]
dynamic = [
    "version",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://napari.org"
Download = "https://github.com/napari/napari"
"Bug Tracker" = "https://github.com/napari/napari/issues"
Documentation = "https://napari.org"
"Source Code" = "https://github.com/napari/napari"

[project.optional-dependencies]
pyside6 = [
    "PySide6 > 6.7, !=6.11.0, !=6.11.1"  # Qt 6.11.1 causes dock widget and layout resizing problems
]
pyqt6 = [
    "PyQt6 > 6.5",
    "PyQt6 != 6.6.1 ; platform_system == 'Darwin'",
    "pyqt6-qt6 !=6.11.0, !=6.11.1"  # Qt 6.11.1 causes dock widget and layout resizing problems
]
pyside = [
    "napari[pyside6]"
]
pyqt5 = [
    "PyQt5>=5.15.8",
    "pyqt5-qt5<=5.15.2; sys_platform == 'Windows'",  # 5.15.2 is latest to build on Windows, required for `uv add` compatability as of uv 0.6.9
]
pyqt = [
    "napari[pyqt6]"
]
qt = [
    "napari[pyqt]"
]
all = [
    "napari[pyqt,optional]"
]
optional-base = [
    "zarr>=3.0.8", # needed by `builtins` (dask.array.from_zarr) to open zarr
    "aiohttp", # needed to open remote files by zarr, replace by extras once https://github.com/zarr-developers/zarr-python/issues/3453 is done
    "napari-metadata>=0.1.0",
    "napari-plugin-manager >=0.1.10, <0.2.0",
    "rapidfuzz>=3",  # fuzzy search in command palette
]
optional-numba = [
    "numba>=0.58.0,<=0.62.1 ; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "numba>=0.58.0 ; platform_system != 'Darwin' or platform_machine != 'x86_64'",
]
optional = [
    "napari[optional-base,optional-numba,bermuda]",
]
bermuda = [
    "bermuda>=0.1.5",
]
triangle = [
    "triangle; python_version <= '3.13'",  # there is no wheel for triangle on python 3.14 at the time and build from source causes problems.
]
partsegcore = [
    "PartSegCore-compiled-backend>=0.15.11",
]
all_optional = [
    "napari[optional,partsegcore]"
]

# the following extras need to match the dependency-groups below
# they will be removed in napari 0.7.0

testing = [
    "babel>=2.9.0",
    "docstring_parser>=0.15",
    "fsspec>=2023.10.0",
    "hypothesis>=6.8.0",
    "lxml[html_clean]>5",
    "matplotlib >= 3.6.1",
    "pooch>=1.6.0",
    "coverage>7",
    "pretend>=1.0.9",
    "pytest-qt >=4.4.0",
    "pytest-pretty>=1.1.0",
    "pytest>=8.3.5",
    "pytest-rerunfailures>=15.1",
    "tensorstore>=0.1.43",
    "virtualenv>=20.24.7",
    "xarray>=2023.5.0",
    "IPython>=7.25.0",
    "qtconsole>=4.5.1",
    "rich>=14.0.0",
    "napari[optional-base, bermuda]",
]
testing_extra = [
    "torch>=1.13.1",
]
# needed for gallery examples
gallery = [
    "glasbey",
    "zarr",
    "dask[array,distributed]",
    "matplotlib",
    "pooch",
    "nilearn",
    "xarray",
    "h5netcdf[h5py]",
    "tifffile[codecs]",
    "meshio",
    "trackastra>=0.4.2",
    "gdown", # to download some large example data files
    "geopandas",
    "contextily",
]
# needed to build docs
docs = [
    "napari[gallery]",
    # napari-meshio, napari-skimage, ndevio needed for docs/getting_started/open_images.md docs PR #907
    "napari-meshio",
    "napari-skimage",
    "ndevio",
    "numpydoc>=1.0.0",
    "sphinx>=8",
    "sphinx-autobuild",
    "sphinx-tabs",
    "sphinx-tags",
    "sphinx-design",
    "sphinx-external-toc<1.1.0", # parallel build issue
    "sphinx-favicon>=1.0",
    "sphinx-copybutton",
    "sphinx-gallery",
    "sphinx_autodoc_typehints==1.12.0",
    "sphinxcontrib-mermaid>=1.0.0",
    "sphinxext-opengraph[social-cards]",
    "sphinxext-rediraffe",
    "myst-nb",
    "napari-sphinx-theme>=1.1.3",
    "matplotlib",
    "lxml[html_clean]>5",
    "imageio-ffmpeg",
    "pydeps",
    "seedir",
    # triangle and bermuda needed for docs/guides/triangulation.md
    "triangle; python_version <= '3.13'",  # there is no wheel for triangle on python 3.14 at the time and build from source causes problems.
    "bermuda>=0.1.4",
    "pytest",
    "linkify-it-py",
    "numba!=0.62.1,!=0.62.0",
]
dev = [
    "prek>=0.4.0",
    "pre-commit>=2.9.0", # to keep old instructions for developers working on napari
    "tox",
    "tox-min-req",
    "napari[testing]",
]
build = [
    "pyqt6",
]

# these need to be kept in sync with the equivalent optional-dependencies
[dependency-groups]
testing = [
    "babel>=2.9.0",
    "docstring_parser>=0.15",
    "fsspec>=2023.10.0",
    "hypothesis>=6.8.0",
    "lxml[html_clean]>5",
    "matplotlib >= 3.6.1",
    "pooch>=1.6.0",
    "coverage>7",
    "pretend>=1.0.9",
    "pytest-qt >=4.4.0",
    "pytest-pretty>=1.1.0",
    "pytest>=8.3.5",
    "pytest-rerunfailures>=15.1",
    "tensorstore>=0.1.43",
    "virtualenv>=20.24.7",
    "xarray>=2023.5.0",
    "IPython>=7.25.0",
    "qtconsole>=4.5.1",
    "rich>=14.0.0",
    "napari[optional-base, bermuda]",
]
testing_extra = [
    "torch>=1.13.1",
]
# needed for gallery examples
gallery = [
    "glasbey",
    "zarr",
    "dask[array,distributed]",
    "matplotlib",
    "pooch",
    "nilearn",
    "xarray",
    "h5netcdf[h5py]",
    "tifffile[codecs]",
    "meshio",
    "trackastra>=0.4.2",
    "gdown", # to download some large example data files
    "geopandas",
    "contextily",
]
# needed to build docs
docs = [
    {include-group = "gallery"},
    # napari-meshio, napari-skimage, ndevio needed for docs/getting_started/open_images.md docs PR #907
    "napari-meshio",
    "napari-skimage",
    "ndevio",
    "numpydoc>=1.0.0",
    "sphinx>=8",
    "sphinx-autobuild",
    "sphinx-tabs",
    "sphinx-tags",
    "sphinx-design",
    "sphinx-external-toc<1.1.0", # parallel build issue
    "sphinx-favicon>=1.0",
    "sphinx-copybutton",
    "sphinx-gallery",
    "sphinx_autodoc_typehints==1.12.0",
    "sphinxcontrib-mermaid>=1.0.0",
    "sphinxext-opengraph[social-cards]",
    "sphinxext-rediraffe",
    "myst-nb",
    "napari-sphinx-theme>=1.1.3",
    "matplotlib",
    "lxml[html_clean]>5",
    "imageio-ffmpeg",
    "pydeps",
    "seedir",
    # triangle and bermuda needed for docs/guides/triangulation.md
    "triangle; python_version <= '3.13'",  # there is no wheel for triangle on python 3.14 at the time and build from source causes problems.
    "bermuda>=0.1.4",
    "pytest",
    "linkify-it-py",
    "numba!=0.62.1,!=0.62.0",
]
dev = [
    "prek>=0.4.0",
    "pre-commit>=2.9.0",  # to keep old instructions for developers working on napari
    "tox",
    "tox-min-req",
    {include-group = "testing"},
]
build = [
    "pyqt6",
]

[project.entry-points.pytest11]
napari = "napari.utils._testsupport"

[project.entry-points."napari.manifest"]
napari_builtins = "napari_builtins:builtins.yaml"

[project.scripts]
napari = "napari._main:main"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[tool.setuptools.package-data]
"*" = [
    "*.pyi",
]
napari = [
    "resources/fonts/*.ttf",
]
napari_builtins = [
    "builtins.yaml",
]


[tool.setuptools_scm]
write_to = "src/napari/_version.py"
fallback_version = "0.7.1.dev0"

[tool.check-manifest]
ignore = [
  ".cirrus.yml",
  ".pre-commit-config.yaml",
  "asv.conf.json",
  "codecov.yml",
  "Makefile",
  "src/napari/_version.py",  # added during build by setuptools_scm
  "tools/minreq.py",
  "tox.ini",
  "src/napari/_qt/qt_resources/_qt_resources_*.py",
  "*.pyi",  # added by make typestubs
  "binder/*",
  ".env_sample",
  ".devcontainer/*",
  "src/napari/resources/icons/_themes/*/*.svg"
]

[tool.ruff]
line-length = 79
extend-exclude = [
    "*vendored*",
    "*_vendor*",
]

fix = true

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E", "F", "W", #flake8
    "UP", # pyupgrade
    "I", # isort
    "YTT", #flake8-2020
    "TC", # flake8-type-checing
    "BLE", # flake8-blind-exception
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "C4", # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "COM", # flake8-commas
    "SIM", # flake8-simplify
    "INP", # flake8-no-pep420
    "PYI", # flake8-pyi
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "TID",  # flake8-tidy-imports # replace absolutify import
    "TRY", # tryceratops
    "ICN", # flake8-import-conventions
    "RUF", # ruff specyfic rules
    "NPY201", # checks compatibility with numpy version 2.0
    "ASYNC", # flake8-async
    "EXE", # flake8-executable
    "FA", # flake8-future-annotations
    "LOG", # flake8-logging
    "SLOT", # flake8-slots
    "PT", # flake8-pytest-style
    "T20", # flake8-print
]
ignore = [
    "E501", "TC001",
    "A003", # flake8-builtins - we have class attributes violating these rule
    "COM812", # flake8-commas - we don't like adding comma on single line of arguments
    "COM819", # conflicts with ruff-format
    "RET504", # not fixed yet https://github.com/charliermarsh/ruff/issues/2950
    "TRY003", # require implement multiple exception class
    "RUF005", # problem with numpy compatybility, see https://github.com/charliermarsh/ruff/issues/2142#issuecomment-1451038741
    "B028", # need to be fixed
    "PYI015", # it produces bad looking files (@jni opinion)
    "W191", "Q000", "Q001", "Q002", "Q003", "ISC001", # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "UP007", # temporary disable migrtion form Union[X, Y] to X | Y
    "UP045", # temporary disable migrtion from Optional[X] to X | None
    "TC006", # put types in quotes in typing.cast
]

[tool.ruff.lint.per-file-ignores]
"src/napari/_vispy/__init__.py" = ["E402"]
"**/_tests/*.py" = ["B011", "INP001", "TRY301", "B018", "RUF012", "TID253"]
"src/napari/utils/_testsupport.py" = ["B011"]
"tools/validate_strings.py" = ["F401"]
"tools/**" = ["INP001", "T20", "LOG015"]
"examples/**" = ["ICN001", "INP001", "T20", "LOG015", "TID253"]
"**/vendored/**" = ["TID"]
"src/napari/benchmarks/**" = ["RUF012", "TID252", "TID253"]
"src/napari_builtins/**" = ["TID253"]

[tool.ruff.lint.flake8-builtins]
builtins-allowed-modules = ["io", "types", "threading"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic.ConfigDict", "napari.utils.events.EventedModel"]
#quote-annotations = true

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.flake8-tidy-imports]
# Disallow all relative imports.
ban-relative-imports = "all"
# Expensive imports should be lazy loaded within functions instead of module
banned-module-level-imports = ["scipy", "pandas", "dask.array"]

[tool.ruff.lint.isort]
known-first-party=['napari']
combine-as-imports = true

[tool.ruff.lint.flake8-import-conventions]
[tool.ruff.lint.flake8-import-conventions.extend-aliases]
# Declare a custom alias for the `matplotlib` module.
"dask.array" = "da"
xarray = "xr"

[tool.pytest.ini_options]
# These follow standard library warnings filters syntax.  See more here:
# https://docs.python.org/3/library/warnings.html#describing-warning-filters
addopts = ["--maxfail=5",  "--durations=10",  "-ra", "--strict-markers", "--strict-config"]
console_output_style = "count"
minversion = "8"
# log_cli_level = "INFO"
xfail_strict = true
testpaths = ["napari", "napari_builtins"]
#pythonpath = "src"


# NOTE: only put things that will never change in here.
# napari deprecation and future warnings should NOT go in here.
# instead... assert the warning with `pytest.warns()` in the relevant test,
# That way we can clean them up when no longer necessary
filterwarnings = [
  "error:::napari", # turn warnings from napari into errors
  "error:::test_.*", # turn warnings in our own tests into errors
  "default:::napari.+vendored.+",  # just print warnings inside vendored modules
  "ignore::DeprecationWarning:shibokensupport",
  "ignore::DeprecationWarning:ipykernel",
  "ignore::DeprecationWarning:tensorstore",
  "ignore:Accessing zmq Socket:DeprecationWarning:jupyter_client",
  "ignore:pythonw executable not found:UserWarning:",
  "ignore:data shape .* exceeds GL_MAX_TEXTURE_SIZE:UserWarning",
  "ignore:For best performance with Dask arrays in napari:UserWarning:",
  "ignore:numpy.ufunc size changed:RuntimeWarning",
  "ignore:Multiscale rendering is only supported in 2D. In 3D, only the lowest resolution scale is displayed",
  "ignore:Alternative shading modes are only available in 3D, defaulting to none",
  "ignore:distutils Version classes are deprecated::",
  "ignore:There is no current event loop:DeprecationWarning:",
  "ignore:(?s).*Pyarrow will become a required dependency of pandas:DeprecationWarning",  # pandas pyarrow (pandas<3.0),
  # TODO: remove once xarray is updated to avoid this warning
  # https://github.com/pydata/xarray/blame/b1f3fea467f9387ed35c221205a70524f4caa18b/pyproject.toml#L333-L334
  # https://github.com/pydata/xarray/pull/8939
  "ignore:__array__ implementation doesn't accept a copy keyword, so passing copy=False failed.",
  "ignore:pkg_resources is deprecated",
  "ignore:Deprecated call to `pkg_resources.declare_namespace",
  "ignore:'asyncio.WindowsProactorEventLoopPolicy' is deprecated and slated for removal in Python 3.16:DeprecationWarning", # windows ipykernel issue #8666
  "ignore:'asyncio.WindowsSelectorEventLoopPolicy' is deprecated and slated for removal in Python 3.16:DeprecationWarning", # windows ipykernel issue #8666
  "ignore:'asyncio.get_event_loop_policy' is deprecated and slated for removal in Python 3.16:DeprecationWarning",  # windows ipykernel issue #8666
  "ignore:'asyncio.set_event_loop_policy' is deprecated and slated for removal in Python 3.16:DeprecationWarning",  # windows ipykernel issue #8666
  "ignore:System theme detection requires a Qt6 backend:UserWarning",  # delete once Qt5 support is dropped
]
markers = [
    "examples: Test of examples",
    "disable_qthread_start: Disable thread start in this Test",
    "disable_qthread_pool_start: Disable strarting QRunnable using QThreadPool start in this Test",
    "disable_qtimer_start: Disable timer start in this Test",
    "disable_qanimation_start: Disable animation start in this Test",
    'allow_animation_thread: Allow animation thread to run in this Test (normally disabled to prevent segfaults)',
    "enable_console: Don't mock the IPython console (in QtConsole) in this Test",
    # mark slow tests, so they can be skipped using: pytest -m "not slow"
    "slow: mark a test as slow",
    "key_bindings: Test of keybindings",
    "show_qt_viewer: Show the QtViewer in this Test",
]

[tool.ty]

[tool.ty.src]
include = ["src/napari"]
exclude = [
    "src/napari/utils/events/_tests/test_evented_model.py",
]

[tool.ty.rules]
# equivalent of mypy's ignore_missing_imports = true
unresolved-import = "ignore"
# napari intentionally accesses submodules like napari.viewer without a
# top-level import; not reported by mypy either
possibly-missing-submodule = "ignore"

[tool.ty.analysis]
# these packages were effectively treated as `Any` by mypy (untyped), so keep
# that behaviour rather than analyzing their (untyped) sources with ty
replace-imports-with-any = [
    "qtpy.**",
    "vispy.**",
]

# equivalent of mypy ignore_errors = true for broad module patterns
[[tool.ty.overrides]]
include = [
    '**/_tests/**',
    '**/experimental/**',
    '**/_vendor/**',
    '**/benchmarks/**',
    'napari_builtins/**'
]
[tool.ty.overrides.rules]
all = "ignore"

# main's dynamic layer-controls refactor is not typed; ignore it like the rest
# of layer_controls (mirrors mypy's `napari._qt.layer_controls.dynamic.*` entry)
[[tool.ty.overrides]]
include = [
    'src/napari/_qt/layer_controls/dynamic/**',
]
[tool.ty.overrides.rules]
all = "ignore"

# equivalent of mypy ignore_errors = true (see napari issue #2751)
[[tool.ty.overrides]]
include = [
    'src/napari/_qt/code_syntax_highlight.py',
    'src/napari/_qt/containers/_layer_delegate.py',
    'src/napari/_qt/containers/qt_layer_model.py',
