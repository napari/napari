    'src/napari/_qt/dialogs/qt_reader_dialog.py',
    'src/napari/_qt/experimental/qt_chunk_receiver.py',
    'src/napari/_qt/layer_controls/qt_colormap_combobox.py',
    'src/napari/_qt/layer_controls/qt_image_controls.py',
    'src/napari/_qt/layer_controls/qt_image_controls_base.py',
    'src/napari/_qt/layer_controls/qt_labels_controls.py',
    'src/napari/_qt/layer_controls/qt_layer_controls_base.py',
    'src/napari/_qt/layer_controls/qt_layer_controls_container.py',
    'src/napari/_qt/layer_controls/qt_points_controls.py',
    'src/napari/_qt/layer_controls/qt_shapes_controls.py',
    'src/napari/_qt/layer_controls/qt_surface_controls.py',
    'src/napari/_qt/layer_controls/qt_tracks_controls.py',
    'src/napari/_qt/layer_controls/qt_vectors_controls.py',
    'src/napari/_qt/layer_controls/widgets/qt_opacity_blending_controls.py',
    'src/napari/_qt/layer_controls/widgets/qt_text_visibility.py',
    'src/napari/_qt/layer_controls/widgets/qt_out_slice_checkbox.py',
    'src/napari/_qt/layer_controls/widgets/qt_projection_mode_control.py',
    'src/napari/_qt/layer_controls/widgets/_shapes/qt_edge_width_slider.py',
    'src/napari/_qt/layer_controls/widgets/_labels/qt_label_color.py',
    'src/napari/_qt/layer_controls/widgets/_labels/qt_color_mode_combobox.py',
    'src/napari/_qt/layer_controls/widgets/_labels/qt_contiguous_checkbox.py',
