# As much as possible, this file should be kept in sync with:
# https://github.com/napari/docs/blob/main/.circleci/config.yaml
# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.1/configuration-reference
version: 2.1
# Setup config: only decides whether the docs build should run based on
# changed paths, then continues into .circleci/continue_config.yml.
# See: https://circleci.com/developer/orbs/orb/circleci/path-filtering
setup: true
# Orbs are reusable packages of CircleCI configuration that you may share across projects.
# See: https://circleci.com/docs/2.1/orb-intro/
orbs:
  path-filtering: circleci/path-filtering@3.0.0
workflows:
  filter-paths:
    jobs:
      - path-filtering/filter:
          base-revision: main
          config-path: .circleci/continue_config.yml
          mapping: |
            ^(?!(\.github/|\.circleci/)).+ run-build-docs true
