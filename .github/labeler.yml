# This config file maps code base files to GitHub labels.
# We use `.github/workflow/labeler.yml` action and use this file to apply labels to PRs.
# Repo: https://github.com/actions/labeler
# Marketplace Action docs: https://github.com/marketplace/actions/labeler
design:
  - changed-files:
    - any-glob-to-any-file: 'src/napari/_qt/qt_resources/**/*'

maintenance:
  - changed-files:
    - any-glob-to-any-file:
      - '.pre-commit-config.yaml'
      - '.github/**/*'

# topics
'topic:preferences':
  - changed-files:
    - any-glob-to-any-file:
      - 'src/napari/_qt/**/*/preferences_dialog.py'
      - 'src/napari/settings/**/*.py'

'topic:qt':
  - changed-files:
    - any-glob-to-any-file:
      - 'src/napari/_qt/**/*.py'
      - 'src/napari/_qt/**/*.py'
      - 'src/napari/qt/**/*.py'
      - 'src/napari/qt/**/*.py'

'topic:vispy':
  - changed-files:
    - any-glob-to-any-file:
      - 'src/napari/_vispy/**/*.py'

'topic:layer':
  - changed-files:
    - any-glob-to-any-file:
      - 'src/napari/layers/**/*.py'
