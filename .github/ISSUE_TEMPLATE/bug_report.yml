name: "\U0001F41B Bug Report"
description: Report a bug encountered while using napari
labels:
  - "bug"

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue! 🙏🏼

        Please fill out the sections below to help us reproduce the problem.

        If you've found a problem with content on the napari documentation site (napari.org) or with the rendering of the content,
        please let us know [here](https://github.com/napari/docs/issues)

  - type: textarea
    id: bug-report
    attributes:
      label: "\U0001F41B Bug Report"
      description: "Please provide a clear and concise description of the bug."
      placeholder: "What went wrong? What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: "\U0001F4A1 Steps to Reproduce"
      description: "Please provide a minimal code snippet or list of steps to reproduce the bug."
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: "\U0001F4A1 Expected Behavior"
      description: "Please provide a clear and concise description of what you expected to happen."
      placeholder: "What did you expect to happen?"

  - type: textarea
    id: environment
    attributes:
      label: "\U0001F30E Environment"
      description: |
        Please provide detailed information regarding your environment. Please paste the information from the "napari info" dialog in the napari Help menu or the output of `napari --info` here.

        Otherwise, please provide information regarding your operating system (OS), Python version, napari version, Qt backend and version, Qt platform, method of installation, and any other relevant information related to your environment.


      placeholder: |
        napari: 0.10.0a1.dev7+gf3ef55e32
        Platform: macOS-26.6.2-arm64-arm-64bit-Mach-O
        System: MacOS 26.6.2
        Python: 3.14.6 (main, Jul 23 2026, 23:15:57) [Clang 17.0.0 (clang-1700.3.19.1)]
        Qt: 6.11.2
        PyQt6: 6.11.0
        NumPy: 2.5.4
        SciPy: 1.18.1
        Dask: 2026.8.0
        VisPy: 0.17.0
        magicgui: 0.10.2
        superqt: 0.8.2
        in-n-out: 0.2.1
        app-model: 0.5.1
        psygnal: 0.16.1
        npe2: 0.9.0
        pydantic: 2.14.1

        OpenGL:
        - PyOpenGL: 3.1.10
        - GL version: 2.1 Metal - 90.5
        - MAX_TEXTURE_SIZE: np.int32(16384)
        - GL_MAX_3D_TEXTURE_SIZE: 2048

        Screens:
        - screen 1: resolution 1800x1169, scale 2.0

        Optional:
        - numba: 0.68.0
        - triangle not installed
        - napari-plugin-manager: 0.1.11
        - bermuda: 0.1.8
        - PartSegCore: 0.15.14

        Experimental Settings:
        - Async: False
        - Autoswap buffers: False
        - Triangulation backend: Fastest available

        Settings path:
        - /Users/grzegorzbokota/Library/Application Support/napari/napari_d9bae8b035af45bf75f8c1a8b73363c8350f81c2/settings.yaml

        Launch command:
        - /Users/grzegorzbokota/Documents/Projekty/napari/src/napari/__main__.py

        Plugins:
        - napari: 0.10.0a1.dev7+gf3ef55e32 (94 contributions)
        - napari-metadata: 0.4.1 (5 contributions)
        - ndevio: 0.10.0 (20 contributions)
        - napari-svg: 0.2.1 (2 contributions)
        - nbatch: 0.0.5 (0 contributions)
        - napari-console: 0.1.4 (0 contributions)
        - napari-skimage: 0.7.1 (75 contributions)
        - ome-types: 0.6.3 (2 contributions)
        - napari-meshio: 0.0.2 (8 contributions)

    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
        label: "\U0001F4A1 Additional Context"
        description: "Please provide any additional information or context regarding the problem here."
        placeholder: "Add any other context about the problem here."
