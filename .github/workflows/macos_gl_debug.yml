# TEMPORARY workflow for debugging screenshot tests on macOS 26 runners.
# Remove together with the commit that disabled the other PR test workflows.
name: macOS GL debug

on:
  pull_request:
    branches:
      - main

concurrency:
  group: macos-gl-debug-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  COLUMNS: 120
  FORCE_COLOR: 1

jobs:
  debug:
    name: ${{ matrix.platform }} ${{ matrix.backend }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest]
        backend: [pyqt6, pyside6]
        include:
          # control: same tests on the image where they pass
          - platform: macos-15
            backend: pyqt6
    env:
      UV_CONSTRAINT: ${{ github.workspace }}/resources/constraints/constraints_py3.13.txt
      BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -e ".[${BACKEND}]" --group testing
          python -c "import qtpy, vispy; print(qtpy.API_NAME, qtpy.QT_VERSION, vispy.__version__)"
          sw_vers

      - name: Diagnostic script (shared contexts)
        if: always()
        run: python tools/macos_gl_diag.py diag_out/share --rounds 3

      - name: Diagnostic script (no shared contexts)
        if: always()
        run: python tools/macos_gl_diag.py diag_out/noshare --rounds 3 --no-share

      - name: Screenshot tests
        if: always()
        run: >-
          python -m pytest -rfE --color=yes --import-mode=importlib
          src/napari/_qt/_tests/test_qt_viewer.py
          src/napari/_tests/test_with_screenshot.py

      - name: Upload diagnostic images
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diag ${{ matrix.platform }} ${{ matrix.backend }}
          path: diag_out
          if-no-files-found: ignore
