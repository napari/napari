on:
  push:
    paths:
      - CITATION.cff
      - tools/check_citation_authors.py
      - .github/workflows/citation_cff_validate.yml
  pull_request:
    paths:
      - CITATION.cff
      - tools/check_citation_authors.py
      - .github/workflows/citation_cff_validate.yml
  workflow_dispatch:

name: CITATION.cff
jobs:
  Validate-CITATION-cff:
    runs-on: ubuntu-latest
    name: Validate CITATION.cff

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check CITATION.cff author ordering
        run: uv run tools/check_citation_authors.py check-order

      - name: Validate CITATION.cff schema
        run: uvx cffconvert@2.0.0 --validate
