# This is a workflow for upgrading test constraints. It is triggered by:
# - On-demand workflow_dispatch
# - weekly schedule (every Monday at 8:00 UTC)
# - workflow_call from constraints_comment_trigger.yml (comment text "@napari-bot update constraints")
# - pull_request with changed .github/workflows/upgrade_test_constraints.yml
#
# The GitHub workflows have the following limitations:
# - There is no pull request comment trigger for workflows.
#   The `issue_comment` trigger is used instead because it is used for pull requests too.
#   (See constraints_comment_trigger.yml)
# - If a workflow is triggered by pull_requests from a forked repository,
#   then it does not have access to secrets.
#   So it is not possible to create PR from a forked repository.
# - If a comment triggers a workflow, then it is triggered on the main branch
#   and not on the branch from PR where the comment was created.
# - In workflow triggers it is only possible to depend on a created event, without any conditions.
#   So it is not possible to trigger workflow only when the comment contains specific text.
#   So we need to check it in the workflow.
#   It will produce multiple empty runs that will create multiple empty entries in actions,
#   making it harder to find the right one. Because of that, we move the comment triggering workflow
#   to the separate file constraints_comment_trigger.yml.
# - It is not possible to update a pull request from a forked repository using Fine grained personal token.
# - It is not possible to create a pull request to forked repository using Fine grained personal token.
# - There is no interface indicator that the workflow triggered by issue comment is running.
#
# Also, for safety reasons, it is better to store automatically generated changes outside the main repository.
#
# Because of the above limitations, the following approach is used:
# - We use `napari-bot/napari` repository to store automatically generated changes.
# - We don't push changes to the `napari-bot/napari` repository if PR contains changes in workflows.
# - We use two checkouts of the repository:
#   * First into the `.` directory from which we run the workflow.
#   * Second into the `napari_repo` directory from which we create a pull request.
#     If the comment triggers the workflow, then this will contain the branch from which the PR was created.
#     Changes will be pushed to the `napari-bot/napari` repository.
#     If schedule or workflow_dispatch triggers this workflow, then this will contain the main branch.
#     Changes will not be pushed to the `napari/napari` repository.
#     If pull_request triggers this workflow, then this will contain a PR branch.
#     Changes will be only accessible as artifacts.
# - The work splits into two jobs. The `upgrade` job checks out the target
#   branch and compiles the constraints. It holds no secrets. The `push` job
#   runs only code from this workflow's own checkout. It takes the compiled
#   files from the artifact, copies them into a fresh checkout of the target
#   branch, and pushes them with the bot tokens.
# - If a comment triggers this workflow,
#   then we add eyes reaction to the comment to show that the workflow has started.
#   (add_eyes job in constraints_comment_trigger.yml)
#   After finishing the calculation of new constraints, we add rocket reaction to the comment.
#   Then pushing changes to the `napari-bot/napari` repository and adding comment to the PR is
#   done by `tools/create_pr_or_update_existing_one.py`.
name: Upgrade test constraints

on:
  workflow_dispatch: # Allow running on-demand
  schedule:
    # Runs every Monday at 8:00 UTC (4:00 Eastern)
    - cron: '0 8 * * 1'

  workflow_call:

  pull_request:
    paths:
      - '.github/workflows/upgrade_test_constraints.yml'
      - 'tools/compile_constraints.sh'

jobs:
  upgrade:
    name: Compile constraints
    # This job checks out the target branch, so it holds no secrets.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      full_name: ${{ steps.target.outputs.repository }}
      branch: ${{ steps.target.outputs.branch }}
      head_sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Resolve target revision
        # jq -e fails the step when the pull request's head repository is
        # gone. The token raises the API rate limit.
        id: target
        if: github.event_name != 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if [[ "$GITHUB_EVENT_NAME" == "issue_comment" ]]; then
            PR_DATA=$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
            jq -e '.head.repo.full_name' > /dev/null <<< "$PR_DATA"
            jq -r '.head | "repository=\(.repo.full_name)\nbranch=\(.ref)\nsha=\(.sha)"' <<< "$PR_DATA" >> "$GITHUB_OUTPUT"
          else
            echo "repository=$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
            echo "branch=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Disable symlinks
        # A symlink in the target tree could point a file read or write at a
        # file outside it. git now checks a symlink out as a plain file.
        run: git config --global core.symlinks false

      - name: Clone target repo (remote)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          path: napari_repo  # place in a named directory
          repository: ${{ steps.target.outputs.repository }}
          ref: ${{ steps.target.outputs.branch }}
          persist-credentials: 'false'

      - name: Check the target commit
        if: github.event_name != 'pull_request'
        env:
          HEAD_SHA: ${{ steps.target.outputs.sha }}
        run: |
          cd napari_repo
          if [[ "$(git rev-parse HEAD)" != "${HEAD_SHA}" ]]; then
            echo "::error::the target branch moved since it was resolved"
            exit 1
          fi

      - name: Clone target repo (pull request)
        # we need separate step as passing empty token to actions/checkout@v4 will not work
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          path: napari_repo  # place in a named directory
          persist-credentials: 'false'  # Can be set to false as cloning the repo on a pull_request trigger does not require a push/change

      - name: Refuse symlinks in the target tree
        # The upload step follows a symlink to its target.
        run: |
          cd napari_repo
          if git ls-files --stage | grep -q '^120000 '; then
            echo "::error::the target branch tracks symlinks, which this workflow does not support"
            exit 1
          fi

      - name: Clone napari/napari
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: napari/napari
          path: napari_main
          persist-credentials: 'false'

      - name: Set up Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: false


      - name: Upgrade Python dependencies
        # if triggered by pull request, use branch from which the PR was created;
        # there is no risk of leaking tokens as pull_request triggered job
        # do not have access to secrets
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            bash napari_repo/tools/compile_constraints.sh napari_repo/
          else
            bash napari_main/tools/compile_constraints.sh napari_repo/
          fi
        env:
          # uv settings in the target tree are ignored, so uv may not fetch
          # an interpreter that such settings would name.
          UV_PYTHON_DOWNLOADS: never

      - name: Upload constraints
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: constraints
          path: |
            napari_repo/resources/constraints/constraints*.txt
            napari_repo/resources/*pyrefly.txt

      - name: Check builtin extensions
        run: uv run tools/check_extensions.py --ci
        env:
          UV_CONSTRAINT: napari_repo/resources/constraints/constraints_py3.12.txt

  push:
    name: Push constraints & open pull request
    # This job runs only code from this workflow's own checkout, never from
    # the target branch. The target branch is data here: the job copies the
    # compiled files into it and commits them.
    needs: upgrade
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    env:
      FULL_NAME: ${{ needs.upgrade.outputs.full_name }}
      BRANCH: ${{ needs.upgrade.outputs.branch }}
      HEAD_SHA: ${{ needs.upgrade.outputs.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Disable symlinks
        # A symlink in the target tree could point a file read or write at a
        # file outside it. git now checks a symlink out as a plain file.
        run: git config --global core.symlinks false

      - name: Clone target repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: napari_repo  # place in a named directory
          repository: ${{ env.FULL_NAME }}
          ref: ${{ env.BRANCH }}
          persist-credentials: 'false'

      - name: Check the target tree
        # The compile job recorded the commit it used. A branch that moved
        # since then stops the run. Tracked symlinks stop it too.
        run: |
          cd napari_repo
          if [[ "$(git rev-parse HEAD)" != "${HEAD_SHA}" ]]; then
            echo "::error::the target branch moved since the constraints were compiled"
            exit 1
          fi
          if git ls-files --stage | grep -q '^120000 '; then
            echo "::error::the target branch tracks symlinks, which this workflow does not support"
            exit 1
          fi

      - name: Add napari-bot/napari to napari_repo upstreams
        # The credential helper holds no token. git runs it at push time,
        # and it reads the bot token from the environment of that step. The
        # empty first value drops every helper that the runner configures.
        run: |
          cd napari_repo
          git remote -v
          git remote add napari-bot https://github.com/napari-bot/napari.git
          git remote -v
          git config --local credential.https://github.com/napari-bot/napari.git.helper ''
          git config --local --add credential.https://github.com/napari-bot/napari.git.helper \
            '!f() { if [ "$1" = get ]; then printf "%s\n" "username=x-access-token" "password=${GHA_TOKEN_BOT_REPO}"; fi; }; f'

      - name: Download constraints
        # The artifact root is resources/, the common parent of the upload
        # patterns. The download stays outside both checkouts.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: constraints
          path: ${{ runner.temp }}/constraints

      - name: Copy constraints into the target tree
        # Only files that this checkout tracks are copied. A new constraints
        # file needs a tracked placeholder here before the bot can update it.
        run: |
          find "${RUNNER_TEMP}/constraints" -type f | while read -r source; do
            file="resources/${source#"${RUNNER_TEMP}/constraints/"}"
            if git ls-files --error-unmatch "${file}" > /dev/null 2>&1; then
              install -m 0644 "${source}" "napari_repo/${file}"
            else
              echo "skip ${file}: not tracked"
            fi
          done

      - name: Set up Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Create commit
        # The push step alone receives the bot token. The credential helper
        # of napari_repo reads it from the process environment, so it never
        # lands in a file on the runner.
        run: uv run tools/create_pr_or_update_existing_one.py
        env:
            GHA_TOKEN_BOT_REPO: ${{ secrets.GHA_TOKEN_BOT_REPO }}
            GHA_TOKEN_MAIN_REPO: ${{ secrets.GHA_TOKEN_NAPARI_BOT_MAIN_REPO }}
            PR_NUMBER: ${{ github.event.issue.number }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            PYTHON_VERSION_FOR_DESCRIPTION: "3.14"
