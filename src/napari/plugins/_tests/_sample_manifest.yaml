name: my-plugin
display_name: My Plugin
contributions:
  commands:
    - id: my-plugin.hello_world
      title: Hello World
    - id: my-plugin.some_reader
      title: Some Reader
    - id: my-plugin.my_writer
      title: Image Writer
    - id: my-plugin.generate_random_data
      title: Generate uniform random data
    - id: my-plugin.some_widget
      title: Create my widget
  readers:
    - command: my-plugin.some_reader
      filename_patterns: ["*.fzy", "*.fzzy"]
      accepts_directories: true
  writers:
    - command: my-plugin.my_writer
      filename_extensions: ["*.tif", "*.tiff"]
      layer_types: ["image"]
  widgets:
    - command: my-plugin.some_widget
      display_name: My Widget
  menus:
    napari/file/new_layer:
      - submenu: mysubmenu
      - command: my-plugin.hello_world
    my-plugin/submenu:
      - command: my-plugin.hello_world
  submenus:
    - id: mysubmenu
      label: My SubMenu
  themes:
    - label: "SampleTheme"
      id: "sample_theme"
      type: "dark"
      colors:
        background: "#272822"
        foreground: "#75715e"
  configuration:
    - title: Demo Configuration for widget 1
      properties:
        my_plugin.reader.lazy:
          type: boolean
          default: false
          title: bool input
          description: Whether to load images lazily with dask
        my_plugin.reader.sad:
          type: integer
          default: 10
          title: integer input
          description: Whether to load images lazily with sad
    - title: Demo Configuration for widget 2
      properties:
        my_plugin.reader.dsasdas:
          type: number
          default: 2.1
          title: Change size of ...
          description: no desc
  sample_data:
    - display_name: Some Random Data (512 x 512)
      key: random_data
      command: my-plugin.generate_random_data
    - display_name: Random internet image
      key: internet_image
      uri: https://picsum.photos/1024
